name: Send Douyin Messages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only verify login and friends without sending
        type: boolean
        default: false
  schedule:
    - cron: "0 20 * * *"
      timezone: "Asia/Shanghai"

concurrency:
  group: douyin-daily-sender
  cancel-in-progress: false

jobs:
  send:
    # Self-hosted Windows runner (中国 IP) to avoid Douyin risk-control that
    # blocks GitHub-hosted US runners. Dependencies are pre-installed in
    # O:\douyin-venv (Python 3.12 + playwright + chromium via npmmirror).
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
      DOUYIN_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      WEBHOOK_HEADERS: ${{ secrets.WEBHOOK_HEADERS }}
      WEBHOOK_TEMPLATE: ${{ secrets.WEBHOOK_TEMPLATE }}
      HEADLESS: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Write protected configuration
        shell: pwsh
        run: |
          [System.IO.File]::WriteAllText("$PWD\config.json", $env:DOUYIN_CONFIG)
      - name: Run
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.dry_run }}" -eq "true") {
            & O:\douyin-venv\Scripts\python.exe run.py --dry-run
          } else {
            & O:\douyin-venv\Scripts\python.exe run.py
          }
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-failure-${{ github.run_id }}
          path: artifacts/
          retention-days: 3
