name: Send Douyin Messages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only verify login and friends without sending
        type: boolean
        default: false
  schedule:
    - cron: "0 20 * * *"
      timezone: "Asia/Shanghai"

concurrency:
  group: douyin-daily-sender
  cancel-in-progress: false

jobs:
  send:
    # Self-hosted Windows runner (中国 IP) to avoid Douyin risk-control that
    # blocks GitHub-hosted US runners. Dependencies are pre-installed in
    # O:\douyin-venv (Python 3.12 + playwright + chromium via npmmirror).
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
      DOUYIN_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      WEBHOOK_HEADERS: ${{ secrets.WEBHOOK_HEADERS }}
      WEBHOOK_TEMPLATE: ${{ secrets.WEBHOOK_TEMPLATE }}
      HEADLESS: "true"
      EVENT_NAME: ${{ github.event_name }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Write config and Run
        shell: bash
        run: |
          # 用 Python 写 config.json（正确处理 UTF-8 / 多行 JSON）
          /o/douyin-venv/Scripts/python.exe -c "import os; open('config.json','w',encoding='utf-8').write(os.environ['DOUYIN_CONFIG'])"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" = "true" ]; then
            /o/douyin-venv/Scripts/python.exe run.py --dry-run
          else
            /o/douyin-venv/Scripts/python.exe run.py
          fi
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-failure-${{ github.run_id }}
          path: artifacts/
          retention-days: 3
