name: Send Douyin Messages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Only verify login and friends without sending
        type: boolean
        default: false
  schedule:
    - cron: "0 20 * * *"
      timezone: "Asia/Shanghai"

concurrency:
  group: douyin-daily-sender
  cancel-in-progress: false

jobs:
  send:
    # Self-hosted Windows runner (中国 IP) to avoid Douyin risk-control that
    # blocks GitHub-hosted US runners. Dependencies are pre-installed in
    # O:\douyin-venv (Python 3.12 + playwright + chromium via npmmirror).
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      DOUYIN_COOKIE: ${{ secrets.DOUYIN_COOKIE }}
      DOUYIN_CONFIG: ${{ secrets.DOUYIN_CONFIG }}
      DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
      DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      WEBHOOK_HEADERS: ${{ secrets.WEBHOOK_HEADERS }}
      WEBHOOK_TEMPLATE: ${{ secrets.WEBHOOK_TEMPLATE }}
      HEADLESS: "true"
      EVENT_NAME: ${{ github.event_name }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Write config and Run
        # NOTE: on Windows runners `shell: bash` resolves to C:\WINDOWS\system32\bash.EXE
        # (WSL bash). Without WSL2 installed that aborts with HCS_E_HYPERV_NOT_INSTALLED.
        # Use the built-in Windows PowerShell 5.1 instead. Keep this script ASCII-only:
        # PS 5.1 decodes BOM-less scripts as ANSI, so non-ASCII would be mangled.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText((Join-Path $PWD 'config.json'), $env:DOUYIN_CONFIG, $utf8)
          Write-Host "config.json written, bytes=$((Get-Item 'config.json').Length)"

          $py = 'O:\douyin-venv\Scripts\python.exe'
          if ($env:EVENT_NAME -eq 'workflow_dispatch' -and $env:DRY_RUN -eq 'true') {
            Write-Host '=== mode: dry-run ==='
            & $py run.py --dry-run
          } else {
            Write-Host '=== mode: real send ==='
            & $py run.py
          }
          $code = $LASTEXITCODE
          Write-Host "python exit code = $code"
          exit $code
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: douyin-failure-${{ github.run_id }}
          path: artifacts/
          retention-days: 3
